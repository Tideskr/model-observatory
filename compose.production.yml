name: model-observatory

x-app-environment: &app-environment
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: 8787
  PUBLIC_ORIGIN: https://check.skr.moe
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  DATABASE_SSL: "false"
  LOG_LEVEL: info
  ENABLE_API_DOCS: "false"
  SCORING_RELEASE_ID: stage-c-trusted-likelihood-v2
  REPOSITORY_URL: https://github.com/Tideskr/model-observatory
  TRUST_PROXY: "1"
  FRONTEND_DIST_DIR: /app/public
  TOKEN_PEPPER: ${TOKEN_PEPPER}
  QUOTE_SIGNING_SECRET: ${QUOTE_SIGNING_SECRET}
  CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}

x-app-service: &app-service
  image: model-observatory:latest
  environment: *app-environment
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app-service
    build:
      context: .
    restart: "no"
    command: ["sh", "-c", "node dist/db/migrate-cli.js && node dist/scoring/import-cli.js"]

  api:
    <<: *app-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18787}:8787"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *app-service
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
