[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-observatory-runner"
version = "4.2.0"
description = "Local execution service for Model Observatory private checks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Model Observatory" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://check.skr.moe"
Repository = "https://github.com/Tideskr/model-observatory"

[project.scripts]
model-observatory-runner = "model_observatory_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_observatory_runner = [
  "_release/*.json",
  "native/*.js",
  "native/*.mjs",
  "native/*.json",
  "native/*.raw",
]
